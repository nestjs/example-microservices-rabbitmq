services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - '5672:5672'
      # Management UI: http://localhost:15672 (guest / guest)
      - '15672:15672'
  postgres:
    image: postgres:19
    environment:
      POSTGRES_PASSWORD: shop
    ports:
      - '5432:5432'
    volumes:
      - ./.docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
